name: 🥒 Cucumber Selenium Tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  cucumber-tests:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Configurar Java
      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '20'

      # 3️⃣ Configurar Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 4️⃣ Instalar dependencias Node
      - name: Install Node dependencies
        run: npm install

      # 5️⃣ Ejecutar pruebas Maven (esto ya llama a node index.js en verify)
      - name: Run Cucumber tests
        run: mvn clean verify
        env:
          headless: true

      # 6️⃣ Publicar reporte HTML como artefacto
      - name: Upload Cucumber HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-html-report
          path: target/cucumber-html-report

      # 6️⃣ Ejecuta solo escenarios por TAGS
      - name: Run smoke tests
        run: mvn clean verify -Dcucumber.filter.tags="@Smoke"

env:
  headless: true
